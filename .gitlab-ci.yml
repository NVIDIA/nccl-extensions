# Root pipeline for the standalone NCCL Extensions repository.
# Build NCCL once, then run the extension child pipelines.
#
# Child pipelines run selectively: on a merge request pipeline a module's child
# pipeline is triggered only when that module's own sources changed, or when
# shared build/CI infrastructure that affects every module changed. On branch,
# tag and web pipelines every module runs, because `changes:` is only reliable
# for merge requests and post-merge / manual runs should validate everything.

include:
  - local: .gitlab/ci/nccl-build.yml

stages:
  - build_nccl
  - build_extensions
  - test
  - downstream

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Avoid a redundant branch pipeline when the branch already has an open MR;
    # the merge request pipeline (which does the per-module `changes:` filtering
    # below) runs instead.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

build:nccl:
  extends: .build-nccl
  stage: build_nccl

nccl_m2n:
  stage: build_extensions
  needs:
    - job: build:nccl
      artifacts: false
  rules:
    # Non-merge-request pipelines: always run (no reliable `changes:` context).
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
    # Merge request pipelines: run only when this module or shared infra changed.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - nccl_m2n/**/*
        - .gitlab-ci.yml
        - .gitlab/**/*
        - .gitmodules
        - third_party/**/*
  variables:
    PARENT_PIPELINE_ID: "${CI_PIPELINE_ID}"
  trigger:
    include:
      - local: nccl_m2n/.gitlab-ci.yml
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: true

nccl_ep:
  stage: test
  needs:
    - job: build:nccl
      artifacts: false
  rules:
    # Non-merge-request pipelines: always run (no reliable `changes:` context).
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
    # Merge request pipelines: run only when this module or shared infra changed.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - nccl_ep/**/*
        - .gitlab-ci.yml
        - .gitlab/**/*
        - .gitmodules
        - third_party/**/*
  variables:
    PARENT_PIPELINE_ID: "${CI_PIPELINE_ID}"
  trigger:
    include:
      - local: nccl_ep/.gitlab-ci.yml
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: true

github-sim:
  stage: downstream
  needs: []
  rules:
    - if: $GITHUB_SHA
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "nccl_ep/**/*"
        - "nccl_m2n/**/*"
        - "python/**/*"
        - "third_party/**/*"
        - ".clang-format"
        - ".clang-format-ignore"
        - ".gitignore"
        - ".gitmodules"
        - "CONTRIBUTING.md"
        - "LICENSE.txt"
        - "README.md"
        - "PUBLIC_PATHS.txt"
  trigger:
    include:
      - project: gpucomms/cicd-platform
        ref: main
        file: pipelines/nccl-extensions/.nccl-extensions-filtered-ci.yml
    strategy: depend
  variables:
    CI_INFRA_REF: main
    MODE: sim
