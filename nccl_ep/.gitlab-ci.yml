# Standalone port of NCCL's contrib/nccl_ep child pipeline.
# Reference: NCCL commit 540cf9684e99a7b3444dade0a54e827c68a3adc0.

stages:
  - build
  - setup
  - unit_test
  - integration_test

include:
  - local: .gitlab/ci/nccl-build.yml
  - local: .gitlab/cluster-paths.yml

variables:
  FF_USE_FASTZIP: "true"
  FF_ENABLE_JOB_CLEANUP: "true"
  FF_TIMESTAMPS: "true"
  GIT_DEPTH: "1"
  CI_JOB_SUBPATH: "${CI_PIPELINE_ID}/${CI_JOB_ID}"

  EOS_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/gitlab-runner/install/${PARENT_PIPELINE_ID}"
  PRE_NYX_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/gitlab-runner/install/${PARENT_PIPELINE_ID}"
  PRE_TYCHE_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/gitlab-runner/install/${PARENT_PIPELINE_ID}"
  IPP6_INSTALL_DIR: "/storage/gitlab-runner/nccl/install/${PARENT_PIPELINE_ID}"

  IPP6_SLURM_PARTITION: "a100-cicd"
  IPP6_CUDA_HOME: "/storage/toolkits/cuda-12.9"
  NCCL_HOME: "${IPP6_INSTALL_DIR}/build"
  MPI_HOME: "/usr/local/openmpi"

  EOS_CUDA_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/cuda-12.8.0"
  EOS_MPI_HOME: "/usr/mpi/gcc/openmpi-4.1.5rc2"
  PRE_NYX_CUDA_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/cuda-12.8.0"
  PRE_NYX_MPI_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/openmpi-5.0.6"
  PRE_TYCHE_CUDA_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/cuda-13.0"
  PRE_TYCHE_MPI_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/openmpi-5.0.6"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - when: never


##
## Stage: build
##

build_ipp6:
  stage: build
  tags:
    - ipp6-nccl
  timeout: 2h
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl
      artifacts: true
  variables:
    NCCL_HOME: "${IPP6_INSTALL_DIR}/build"
    MPI_HOME: "/usr/local/openmpi"
    NVIDIA_VISIBLE_DEVICES: "void"
    SLURM_PARTITION: ""
    GIT_CLONE_PATH: "${CI_BUILDS_DIR}/${CI_JOB_ID}/${CI_PROJECT_PATH}"
  script:
    - |
      set -euxo pipefail
      source "${CI_PROJECT_DIR}/.gitlab/ci/clusters/ipp6-slurm-config.sh"
      current_dir="$(realpath .)"
      build_image_version="$(get_build_image_version)"
      container_image="$(get_build_tools_image "${build_image_version}")"

      rm -rf "${IPP6_INSTALL_DIR}/build"
      mkdir -p "${IPP6_INSTALL_DIR}/build"
      cp -a .ci/nccl/build/. "${IPP6_INSTALL_DIR}/build/"

      container_mounts="${current_dir}:/workspace,${current_dir}/.ci/nccl:/nccl,${IPP6_INSTALL_DIR}:/nccl_install"
      srun \
        -p cpuonly \
        -J nccl-ep:build \
        -t 01:00:00 \
        -n 1 \
        --exclusive \
        --container-image="${container_image}" \
        --container-mounts="${container_mounts}" \
        env NCCL_HOME=/nccl_install/build \
        NCCL_EP_BUILDDIR=/nccl_install/build \
        MPI_HOME="${MPI_HOME}" \
        make -C /workspace/nccl_ep \
          MPI=1 \
          MPI_HOME="${MPI_HOME}" \
          NCCL_SUBMODULE_HOME=/nccl \
          BUILDDIR=/nccl_install/build \
          NVCC_GENCODE="${NVCC_GENCODE}" \
          ep_test ep_bench

      srun \
        -p cpuonly \
        -J nccl-ep:unit-build \
        -t 01:00:00 \
        -n 1 \
        --exclusive \
        --container-image="${container_image}" \
        --container-mounts="${container_mounts}" \
        env NCCL_HOME=/nccl_install/build \
        NCCL_EP_BUILDDIR=/nccl_install/build \
        make -C /workspace/nccl_ep/tests \
          BUILDDIR=/nccl_install/build \
          GTEST_DIR=/workspace/.ci/googletest/googletest \
          NVCC_GENCODE="${NVCC_GENCODE}"

      ART="${NCCL_EP_ARTIFACT_STAGING:-nccl_ep_install_artifact}"
      rm -rf "${ART}"
      mkdir -p "${ART}/lib" "${ART}/include" "${ART}/test/nccl_ep"
      cp -a "${NCCL_HOME}/lib"/libnccl_ep.* "${ART}/lib/"
      cp -a "${NCCL_HOME}/include/nccl_ep.h" "${ART}/include/"
      cp -a "${NCCL_HOME}/include/nccl_ep" "${ART}/include/"
      cp -a "${NCCL_HOME}/test/nccl_ep/ep_test" "${NCCL_HOME}/test/nccl_ep/ep_bench" "${ART}/test/nccl_ep/"
      for unit_test in "${NCCL_HOME}/test/nccl_ep"/test_*; do
        if [[ -f "${unit_test}" && -x "${unit_test}" ]]; then
          cp -a "${unit_test}" "${ART}/test/nccl_ep/"
        fi
      done
  artifacts:
    paths:
      - nccl_ep_install_artifact/
    expire_in: 48 hours

build_pretyche:
  stage: build
  tags:
    - ptyche
  timeout: 2h
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl
      artifacts: true
  variables:
    CI_BUILDS_DIR: "${PRE_TYCHE_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NCCL_HOME: "${PRE_TYCHE_INSTALL_DIR}/build"
    MPI_HOME: "/usr/local/openmpi"
    NVIDIA_VISIBLE_DEVICES: "void"
    SLURM_PARTITION: ""
  script:
    - |
      set -euxo pipefail
      source "${CI_PROJECT_DIR}/.gitlab/ci/clusters/pre-tyche-config.sh"
      current_dir="$(realpath .)"
      build_image_version="$(get_build_image_version)"
      container_image="$(get_build_tools_image "${build_image_version}")"

      rm -rf "${PRE_TYCHE_INSTALL_DIR}/build"
      mkdir -p "${PRE_TYCHE_INSTALL_DIR}/build"
      cp -a "${CI_PROJECT_DIR}/.gitlab/ci/clusters/pre-tyche-config.sh" "${PRE_TYCHE_INSTALL_DIR}/"
      container_mounts="${current_dir}:/workspace,${current_dir}/.ci/nccl:/nccl,${PRE_TYCHE_INSTALL_DIR}:/nccl_install"

      srun \
        --account="$(get_slurm_account)" \
        -p batch \
        -J nccl:build \
        -t 01:00:00 \
        -n 1 \
        --exclusive \
        --container-image="${container_image}" \
        --container-mounts="${container_mounts}" \
        env NVCC_GENCODE='-gencode=arch=compute_100,code=sm_100' \
        make -C /nccl BUILDDIR=/nccl_install/build src.build

      srun \
        --account="$(get_slurm_account)" \
        -p batch \
        -J nccl-ep:build \
        -t 01:00:00 \
        -n 1 \
        --exclusive \
        --container-image="${container_image}" \
        --container-mounts="${container_mounts}" \
        env NCCL_HOME=/nccl_install/build \
        NCCL_EP_BUILDDIR=/nccl_install/build \
        MPI_HOME="${MPI_HOME}" \
        make -C /workspace/nccl_ep \
          MPI=1 \
          MPI_HOME="${MPI_HOME}" \
          NCCL_SUBMODULE_HOME=/nccl \
          BUILDDIR=/nccl_install/build \
          NVCC_GENCODE='-gencode=arch=compute_100,code=sm_100' \
          ep_test ep_bench

      srun \
        --account="$(get_slurm_account)" \
        -p batch \
        -J nccl-ep:unit-build \
        -t 01:00:00 \
        -n 1 \
        --exclusive \
        --container-image="${container_image}" \
        --container-mounts="${container_mounts}" \
        env NCCL_HOME=/nccl_install/build \
        NCCL_EP_BUILDDIR=/nccl_install/build \
        make -C /workspace/nccl_ep/tests \
          BUILDDIR=/nccl_install/build \
          GTEST_DIR=/workspace/.ci/googletest/googletest \
          NVCC_GENCODE='-gencode=arch=compute_100,code=sm_100'

      ART="${NCCL_EP_ARTIFACT_STAGING:-nccl_ep_install_artifact}"
      rm -rf "${ART}"
      mkdir -p "${ART}/lib" "${ART}/include" "${ART}/test/nccl_ep"
      cp -a "${NCCL_HOME}/lib"/libnccl_ep.* "${ART}/lib/"
      cp -a "${NCCL_HOME}/include/nccl_ep.h" "${ART}/include/"
      cp -a "${NCCL_HOME}/include/nccl_ep" "${ART}/include/"
      cp -a "${NCCL_HOME}/test/nccl_ep/ep_test" "${NCCL_HOME}/test/nccl_ep/ep_bench" "${ART}/test/nccl_ep/"
      for unit_test in "${NCCL_HOME}/test/nccl_ep"/test_*; do
        if [[ -f "${unit_test}" && -x "${unit_test}" ]]; then
          cp -a "${unit_test}" "${ART}/test/nccl_ep/"
        fi
      done
  artifacts:
    paths:
      - nccl_ep_install_artifact/
    expire_in: 48 hours


##
## Stage: setup
##

.setup_base:
  stage: setup
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl
      artifacts: true
    - job: build_ipp6
      artifacts: true
  variables:
    GIT_STRATEGY: clone
    NCCL_BASE_ARTIFACT_DIR: "${CI_PROJECT_DIR}/.ci/nccl/build"
  script:
    - |
      set -euxo pipefail
      ART="${NCCL_EP_ARTIFACT_DIR:-${CI_PROJECT_DIR}/nccl_ep_install_artifact}"
      DST="${NCCL_EP_MERGE_TARGET}"
      mkdir -p "${DST}/lib" "${DST}/include" "${DST}/test/nccl_ep"
      if [[ -n "${NCCL_BASE_ARTIFACT_DIR:-}" ]]; then
        cp -a "${NCCL_BASE_ARTIFACT_DIR}/." "${DST}/"
      fi
      if [[ -n "${NCCL_CLUSTER_CONFIG_SOURCE:-}" ]]; then
        cp -a "${NCCL_CLUSTER_CONFIG_SOURCE}" "${NCCL_CLUSTER_CONFIG_TARGET}"
      fi
      cp -a "${ART}/lib"/libnccl_ep.* "${DST}/lib/"
      cp -a "${ART}/include/nccl_ep.h" "${DST}/include/"
      cp -a "${ART}/include/nccl_ep" "${DST}/include/"
      cp -a "${ART}/test/nccl_ep/ep_test" "${ART}/test/nccl_ep/ep_bench" "${DST}/test/nccl_ep/"
      for unit_test in "${ART}/test/nccl_ep"/test_*; do
        if [[ -f "${unit_test}" && -x "${unit_test}" ]]; then
          cp -a "${unit_test}" "${DST}/test/nccl_ep/"
        fi
      done

setup_eos:
  extends: .setup_base
  tags:
    - nccl-eos
  variables:
    NCCL_EP_MERGE_TARGET: "${EOS_INSTALL_DIR}/build"
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"

setup_prenyx:
  extends: .setup_base
  rules:
    - when: never
  tags:
    - prenyx
  variables:
    NCCL_EP_MERGE_TARGET: "${PRE_NYX_INSTALL_DIR}/build"
    CI_BUILDS_DIR: "${PRE_NYX_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NCCL_CLUSTER_CONFIG_SOURCE: "${CI_PROJECT_DIR}/.gitlab/ci/clusters/pre-nyx-config.sh"
    NCCL_CLUSTER_CONFIG_TARGET: "${PRE_NYX_INSTALL_DIR}/pre-nyx-config.sh"

setup_pretyche:
  extends: .setup_base
  needs:
    - job: build_pretyche
      artifacts: true
  tags:
    - ptyche
  variables:
    NCCL_EP_MERGE_TARGET: "${PRE_TYCHE_INSTALL_DIR}/build"
    NCCL_BASE_ARTIFACT_DIR: ""
    CI_BUILDS_DIR: "${PRE_TYCHE_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"


##
## Stage: unit_test
##

unit_test_eos:
  stage: unit_test
  tags:
    - nccl-eos
  needs:
    - setup_eos
  variables:
    NCCL_HOME: "${EOS_INSTALL_DIR}/build"
    NCCL_EP_HOME: "${EOS_INSTALL_DIR}/build"
    NCCL_EP_BUILDDIR: "${EOS_INSTALL_DIR}/build"
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NNODES: "1"
    NP: "8"
    NGPUS: "8"
    NCCL_EP_UNIT_GPUS: "4"
    SLURM_ACCOUNT: "coreai_libraries_nccl"
    SLURM_TIME: "30"
  script:
    - |
      set -euxo pipefail
      export CUDA_HOME="${EOS_CUDA_HOME}"
      export LD_LIBRARY_PATH="${CUDA_HOME}/lib:${CUDA_HOME}/lib64:${CUDA_HOME}/extras/CUPTI/lib64:${NCCL_HOME}/lib:${LD_LIBRARY_PATH:-}"
      salloc \
        -N "${NNODES}" \
        --ntasks-per-node "${NP}" \
        --exclusive \
        --account="${SLURM_ACCOUNT}" \
        -J "${SLURM_ACCOUNT}-cicd::${GITLAB_USER_LOGIN:-ci}:nccl-ep-unit-eos::${CI_COMMIT_REF_NAME:-detached}:${CI_COMMIT_SHORT_SHA}" \
        -t "${SLURM_TIME}" \
        bash nccl_ep/ci/run_nccl_ep_unit_tests.sh

unit_test_pretyche:
  stage: unit_test
  tags:
    - ptyche
  needs:
    - setup_pretyche
  variables:
    NCCL_HOME: "${PRE_TYCHE_INSTALL_DIR}/build"
    NCCL_EP_HOME: "${PRE_TYCHE_INSTALL_DIR}/build"
    NCCL_EP_BUILDDIR: "${PRE_TYCHE_INSTALL_DIR}/build"
    CI_BUILDS_DIR: "${PRE_TYCHE_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NNODES: "1"
    NP: "4"
    NGPUS: "4"
    NCCL_EP_UNIT_GPUS: "4"
    SLURM_PARTITION: "batch"
    SLURM_ACCOUNT: "coreai_libraries_nccl"
    SLURM_TIME: "30"
  script:
    - |
      set -euxo pipefail
      source "${PRE_TYCHE_INSTALL_DIR}/pre-tyche-config.sh"
      export CUDA_HOME="${PRE_TYCHE_CUDA_HOME}"
      export LD_LIBRARY_PATH="${CUDA_HOME}/lib:${CUDA_HOME}/lib64:${CUDA_HOME}/extras/CUPTI/lib64:${NCCL_HOME}/lib:${LD_LIBRARY_PATH:-}"
      salloc \
        -N "${NNODES}" \
        --ntasks-per-node "${NP}" \
        --exclusive \
        -p "${SLURM_PARTITION}" \
        --account="${SLURM_ACCOUNT}" \
        -J "${SLURM_ACCOUNT}-cicd::${GITLAB_USER_LOGIN:-ci}:nccl-ep-unit-pretyche::${CI_COMMIT_REF_NAME:-detached}:${CI_COMMIT_SHORT_SHA}" \
        -t "${SLURM_TIME}" \
        bash nccl_ep/ci/run_nccl_ep_unit_tests.sh


##
## Stage: integration_test
##

integration_test_ipp6:
  stage: integration_test
  rules:
    - when: never
  needs:
    - job: build_ipp6
      artifacts: false
  tags:
    - ipp6-nccl
  variables:
    NCCL_HOME: "${IPP6_INSTALL_DIR}/build"
    NCCL_EP_HOME: "${IPP6_INSTALL_DIR}/build"
    NNODES: "1"
    NP: "8"
    NGPUS: "8"
    SLURM_PARTITION: "h100x8-cicd"
    SLURM_ACCOUNT: "coreai_libraries_nccl"
    SLURM_TIME: "30"
    NCCL_EP_BENCH_HT: "0"
  script:
    - |
      set -euxo pipefail
      salloc \
        -N "${NNODES}" \
        --exclusive \
        -p "${SLURM_PARTITION}" \
        --account="${SLURM_ACCOUNT}" \
        -J "${SLURM_ACCOUNT}-cicd::${GITLAB_USER_LOGIN:-ci}:nccl-ep-test::${CI_COMMIT_REF_NAME:-detached}:${CI_COMMIT_SHORT_SHA}" \
        -t "${SLURM_TIME}" \
        bash nccl_ep/ci/run_nccl_ep_ci_tests.sh

integration_test_eos:
  stage: integration_test
  tags:
    - nccl-eos
  needs:
    - setup_eos
    - unit_test_eos
  variables:
    NCCL_HOME: "${EOS_INSTALL_DIR}/build"
    NCCL_EP_HOME: "${EOS_INSTALL_DIR}/build"
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NNODES: "1"
    NP: "8"
    NGPUS: "8"
    SLURM_ACCOUNT: "coreai_libraries_nccl"
    SLURM_TIME: "60"
    NCCL_EP_BENCH_HT: "0"
  script:
    - |
      set -euxo pipefail
      export CUDA_HOME="${EOS_CUDA_HOME}"
      export MPI_HOME="${EOS_MPI_HOME}"
      export PATH="${MPI_HOME}/bin:${PATH}"
      export LD_LIBRARY_PATH="${CUDA_HOME}/lib:${CUDA_HOME}/lib64:${CUDA_HOME}/extras/CUPTI/lib64:${NCCL_HOME}/lib:${MPI_HOME}/lib:${LD_LIBRARY_PATH:-}"
      export OMPI_MCA_btl_tcp_if_include="eth3"
      export OMPI_MCA_btl="tcp,self"
      salloc \
        -N "${NNODES}" \
        --ntasks-per-node "${NP}" \
        --exclusive \
        --account="${SLURM_ACCOUNT}" \
        -J "${SLURM_ACCOUNT}-cicd::${GITLAB_USER_LOGIN:-ci}:nccl-ep-test-eos::${CI_COMMIT_REF_NAME:-detached}:${CI_COMMIT_SHORT_SHA}" \
        -t "${SLURM_TIME}" \
        bash nccl_ep/ci/run_nccl_ep_ci_tests.sh

integration_test_prenyx:
  stage: integration_test
  rules:
    - when: never
  tags:
    - prenyx
  needs:
    - setup_prenyx
  variables:
    NCCL_HOME: "${PRE_NYX_INSTALL_DIR}/build"
    NCCL_EP_HOME: "${PRE_NYX_INSTALL_DIR}/build"
    CI_BUILDS_DIR: "${PRE_NYX_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NNODES: "1"
    NP: "8"
    NGPUS: "8"
    SLURM_PARTITION: "batch"
    SLURM_ACCOUNT: "coreai_libraries_nccl"
    SLURM_TIME: "60"
    NCCL_EP_BENCH_HT: "1"
  script:
    - |
      set -euxo pipefail
      source "${PRE_NYX_INSTALL_DIR}/pre-nyx-config.sh"
      export CUDA_HOME="${PRE_NYX_CUDA_HOME}"
      export MPI_HOME="${PRE_NYX_MPI_HOME}"
      export PATH="${MPI_HOME}/bin:${PATH}"
      export LD_LIBRARY_PATH="${CUDA_HOME}/lib:${CUDA_HOME}/lib64:${CUDA_HOME}/extras/CUPTI/lib64:${NCCL_HOME}/lib:${MPI_HOME}/lib:${LD_LIBRARY_PATH:-}"
      salloc \
        -N "${NNODES}" \
        --ntasks-per-node "${NP}" \
        --exclusive \
        -p "${SLURM_PARTITION}" \
        --account="${SLURM_ACCOUNT}" \
        -J "${SLURM_ACCOUNT}-cicd::${GITLAB_USER_LOGIN:-ci}:nccl-ep-test-prenyx::${CI_COMMIT_REF_NAME:-detached}:${CI_COMMIT_SHORT_SHA}" \
        -t "${SLURM_TIME}" \
        bash nccl_ep/ci/run_nccl_ep_ci_tests.sh

integration_test_pretyche:
  stage: integration_test
  tags:
    - ptyche
  needs:
    - setup_pretyche
    - unit_test_pretyche
  variables:
    NCCL_HOME: "${PRE_TYCHE_INSTALL_DIR}/build"
    NCCL_EP_HOME: "${PRE_TYCHE_INSTALL_DIR}/build"
    CI_BUILDS_DIR: "${PRE_TYCHE_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NNODES: "1"
    NP: "4"
    NGPUS: "4"
    SLURM_PARTITION: "batch"
    SLURM_ACCOUNT: "coreai_libraries_nccl"
    SLURM_TIME: "60"
    NCCL_EP_BENCH_HT: "1"
  script:
    - |
      set -euxo pipefail
      source "${PRE_TYCHE_INSTALL_DIR}/pre-tyche-config.sh"
      export CUDA_HOME="${PRE_TYCHE_CUDA_HOME}"
      export MPI_HOME="${PRE_TYCHE_MPI_HOME}"
      export PATH="${MPI_HOME}/bin:${PATH}"
      export LD_LIBRARY_PATH="${CUDA_HOME}/lib:${CUDA_HOME}/lib64:${CUDA_HOME}/extras/CUPTI/lib64:${NCCL_HOME}/lib:${MPI_HOME}/lib:${LD_LIBRARY_PATH:-}"
      salloc \
        -N "${NNODES}" \
        --ntasks-per-node "${NP}" \
        --exclusive \
        -p "${SLURM_PARTITION}" \
        --account="${SLURM_ACCOUNT}" \
        -J "${SLURM_ACCOUNT}-cicd::${GITLAB_USER_LOGIN:-ci}:nccl-ep-test-pretyche::${CI_COMMIT_REF_NAME:-detached}:${CI_COMMIT_SHORT_SHA}" \
        -t "${SLURM_TIME}" \
        bash nccl_ep/ci/run_nccl_ep_ci_tests.sh
