[project]
name = "ft_collective"
dynamic = ["version"]
requires-python = ">=3.9"
description = "Fault-tolerant LSA collective Python bindings (ctypes) for the FTCollectiveHandle C API"
license = {text = "Apache-2.0"}
authors = [
    { name = "NVIDIA Corporation" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: GPU :: NVIDIA CUDA",
]

# Pure Python — no compiled extensions bundled.
# Build libft_collective.so separately with 'make' in ft_handle/ and set
# FT_COLLECTIVE_LIB=<path> or add the directory to LD_LIBRARY_PATH.
dependencies = ["torch>=2.1"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["ft_collective*"]

[tool.setuptools.dynamic]
version = { attr = "ft_collective._version.__version__" }
