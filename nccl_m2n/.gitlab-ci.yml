# Standalone NCCL M2N child pipeline, dispatched by the repository root CI.

include:
  - local: .gitlab/ci/nccl-build.yml
  - local: .gitlab/cluster-paths.yml

stages:
  - build
  - package
  - setup
  - unit_test
  - integration_test

variables:
  CI_JOB_SUBPATH: "${CI_PIPELINE_ID}/${CI_JOB_ID}"
  EOS_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/gitlab-runner/install/${CI_PIPELINE_ID}/eos"
  EOS_CUDA_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/cuda-12.8.0"
  PRE_TYCHE_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/gitlab-runner/install/${CI_PIPELINE_ID}/pretyche"
  PRE_TYCHE_CUDA_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/cuda-13.0"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - when: never

build:nccl_m2n:
  extends: .ipp6-build
  stage: build
  timeout: 1h
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl
      artifacts: true
  script:
    - |
      set -euxo pipefail
      test -s "${CI_PROJECT_DIR}/.ci/nccl/NCCL_COMMIT"
      echo "Using NCCL commit $(cat "${CI_PROJECT_DIR}/.ci/nccl/NCCL_COMMIT")"
      srun \
        -p cpuonly \
        -J nccl-extensions:m2n \
        -t 01:00:00 \
        -n 1 \
        --exclusive \
        --container-image="${BUILD_CONTAINER_IMAGE}" \
        --container-mounts="${CI_PROJECT_DIR}:${CI_PROJECT_DIR}" \
        env \
        NCCL_HOME="${CI_PROJECT_DIR}/.ci/nccl/build" \
        MPI_HOME="/usr/local/openmpi" \
        make -C "${CI_PROJECT_DIR}/nccl_m2n" -j"$(nproc)" \
        NVCC_GENCODE="$NVCC_GENCODE" \
        GTEST_DIR="${CI_PROJECT_DIR}/.ci/googletest/googletest" \
        lib tests bench reshard
      test -s nccl_m2n/build/lib/libnccl_m2n.so
      test -s nccl_m2n/build/include/nccl_m2n.h
      test -x nccl_m2n/build/bin/basic_api_test_local
      test -x nccl_m2n/build/bin/basic_api_test_mpi
      test -x nccl_m2n/build/bin/reshard_bench
      # Every function declared in the public header must (a) carry
      # NCCL_M2N_API and (b) be an exported, defined text symbol. The CMake
      # build compiles hidden-by-default, so a missing annotation links here
      # under Make and fails to link there.
      #
      # (a) is derived from the UNANNOTATED declaration list on purpose. Deriving
      # the expected set from annotated declarations only would let the check
      # shrink silently: remove an annotation and the entry point drops out of
      # the expected set too, so the check passes while the hidden-by-default
      # CMake build stops exporting it.
      hdr=nccl_m2n/src/nccl_m2n.h
      lib=nccl_m2n/build/lib/libnccl_m2n.so
      work=$(mktemp -d)
      trap 'rm -rf "$work"' EXIT
      # Leading whitespace is allowed on purpose: deleting just the
      # NCCL_M2N_API token leaves the declaration indented, and a pattern
      # anchored hard to column 0 would stop matching the line entirely --
      # the declaration would vanish from BOTH sets and the check would pass.
      grep -oE '^[[:space:]]*(NCCL_M2N_API[[:space:]]+)?(const char\*|ncclResult_t)[[:space:]]+nccl[A-Za-z0-9_]+\(' "$hdr" \
        | sed -E 's/.*[^A-Za-z0-9_](nccl[A-Za-z0-9_]+)\($/\1/' | sort -u > "$work/declared"
      grep -oE '^[[:space:]]*NCCL_M2N_API[[:space:]]+(const char\*|ncclResult_t)[[:space:]]+nccl[A-Za-z0-9_]+\(' "$hdr" \
        | sed -E 's/.*[^A-Za-z0-9_](nccl[A-Za-z0-9_]+)\($/\1/' | sort -u > "$work/annotated"
      test -s "$work/declared"
      if ! comm -23 "$work/declared" "$work/annotated" > "$work/unannotated"; then exit 1; fi
      if [ -s "$work/unannotated" ]; then
        echo "ERROR: public header declarations missing the NCCL_M2N_API annotation:" >&2
        cat "$work/unannotated" >&2
        echo "These link under Make and fail to link under the hidden-by-default CMake build." >&2
        exit 1
      fi
      nm -D --defined-only "$lib" | awk '$2 == "T" { print $3 }' | sort -u > "$work/actual"
      if ! comm -23 "$work/declared" "$work/actual" > "$work/missing"; then exit 1; fi
      if [ -s "$work/missing" ]; then
        echo "ERROR: public entry points declared in the header but not exported by $lib:" >&2
        cat "$work/missing" >&2
        exit 1
      fi
      echo "All $(wc -l < "$work/declared") public entry points are annotated and exported."
  artifacts:
    when: always
    name: "nccl-m2n-${CI_COMMIT_SHORT_SHA}"
    expire_in: 24 hours
    paths:
      - nccl_m2n/build/include/
      - nccl_m2n/build/lib/
      - nccl_m2n/build/bin/

build_pretyche:
  stage: build
  tags:
    - ptyche
  timeout: 2h
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl
      artifacts: true
  variables:
    CI_BUILDS_DIR: "${PRE_TYCHE_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NVIDIA_VISIBLE_DEVICES: "void"
    SLURM_PARTITION: ""
  script:
    - |
      set -euxo pipefail
      source "${CI_PROJECT_DIR}/.gitlab/ci/clusters/pre-tyche-config.sh"
      current_dir="$(realpath .)"
      build_image_version="$(get_build_image_version)"
      container_image="$(get_build_tools_image "${build_image_version}")"
      install_dir="${PRE_TYCHE_INSTALL_DIR}"
      rm -rf "${install_dir}/build"
      mkdir -p "${install_dir}/build"
      cp -a "${CI_PROJECT_DIR}/.gitlab/ci/clusters/pre-tyche-config.sh" "${install_dir}/"
      container_mounts="${current_dir}:/workspace,${current_dir}/.ci/nccl:/nccl,${install_dir}:/nccl_install"

      srun \
        --account="$(get_slurm_account)" \
        -p batch \
        -J nccl:m2n-build-base \
        -t 01:00:00 \
        -n 1 \
        --exclusive \
        --container-image="${container_image}" \
        --container-mounts="${container_mounts}" \
        env NVCC_GENCODE='-gencode=arch=compute_100,code=sm_100' \
        bash -lc 'make -C /nccl -j"$(nproc)" BUILDDIR=/nccl_install/build src.build'

      srun \
        --account="$(get_slurm_account)" \
        -p batch \
        -J nccl:m2n-build-tests \
        -t 01:00:00 \
        -n 1 \
        --exclusive \
        --container-image="${container_image}" \
        --container-mounts="${container_mounts}" \
        env NCCL_HOME=/nccl_install/build \
        MPI_HOME=/usr/local/openmpi \
        make -C /workspace/nccl_m2n -j"$(nproc)" \
          BUILDDIR=/nccl_install/build \
          NVCC_GENCODE='-gencode=arch=compute_100,code=sm_100' \
          GTEST_DIR=/workspace/.ci/googletest/googletest \
          lib tests bench reshard

      test -x "${install_dir}/build/bin/basic_api_test_local"
      test -x "${install_dir}/build/bin/basic_api_test_mpi"
      test -x "${install_dir}/build/bin/reshard_bench"
      artifact_dir="${NCCL_M2N_ARTIFACT_STAGING:-nccl_m2n_install_artifact}"
      rm -rf "${artifact_dir}"
      mkdir -p "${artifact_dir}/bin" "${artifact_dir}/include" "${artifact_dir}/lib"
      cp -a "${install_dir}/build/lib/libnccl_m2n.so" "${artifact_dir}/lib/"
      cp -a "${install_dir}/build/include/nccl_m2n.h" "${artifact_dir}/include/"
      cp -a "${install_dir}/build/bin/basic_api_test_local" "${artifact_dir}/bin/"
      cp -a "${install_dir}/build/bin/basic_api_test_mpi" "${artifact_dir}/bin/"
      cp -a "${install_dir}/build/bin/reshard_bench" "${artifact_dir}/bin/"
  artifacts:
    paths:
      - nccl_m2n_install_artifact/
    expire_in: 48 hours

setup_eos:
  stage: setup
  tags:
    - nccl-eos
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl
      artifacts: true
    - job: build:nccl_m2n
      artifacts: true
  variables:
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
  script:
    - |
      set -euxo pipefail
      dst="${EOS_INSTALL_DIR}/build"
      rm -rf "${dst}"
      mkdir -p "${dst}/bin" "${dst}/include" "${dst}/lib"
      cp -a "${CI_PROJECT_DIR}/.ci/nccl/build/." "${dst}/"
      cp -a "${CI_PROJECT_DIR}/nccl_m2n/build/lib/libnccl_m2n.so" "${dst}/lib/"
      cp -a "${CI_PROJECT_DIR}/nccl_m2n/build/include/nccl_m2n.h" "${dst}/include/"
      cp -a "${CI_PROJECT_DIR}/nccl_m2n/build/bin/basic_api_test_local" "${dst}/bin/"
      cp -a "${CI_PROJECT_DIR}/nccl_m2n/build/bin/basic_api_test_mpi" "${dst}/bin/"
      cp -a "${CI_PROJECT_DIR}/nccl_m2n/build/bin/reshard_bench" "${dst}/bin/"

setup_pretyche:
  stage: setup
  tags:
    - ptyche
  needs:
    - job: build_pretyche
      artifacts: true
  variables:
    CI_BUILDS_DIR: "${PRE_TYCHE_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
  script:
    - |
      set -euxo pipefail
      artifact_dir="${NCCL_M2N_ARTIFACT_DIR:-${CI_PROJECT_DIR}/nccl_m2n_install_artifact}"
      dst="${PRE_TYCHE_INSTALL_DIR}/build"
      mkdir -p "${dst}/bin" "${dst}/include" "${dst}/lib"
      cp -a "${artifact_dir}/." "${dst}/"

unit_test_eos:
  stage: unit_test
  tags:
    - nccl-eos
  needs:
    - setup_eos
  variables:
    NCCL_HOME: "${EOS_INSTALL_DIR}/build"
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NNODES: "1"
    NP: "8"
    NGPUS: "8"
    SLURM_ACCOUNT: "coreai_libraries_nccl"
    SLURM_TIME: "30"
  script:
    - |
      set -euxo pipefail
      export CUDA_HOME="${EOS_CUDA_HOME}"
      export LD_LIBRARY_PATH="${CUDA_HOME}/lib:${CUDA_HOME}/lib64:${CUDA_HOME}/extras/CUPTI/lib64:${NCCL_HOME}/lib:${LD_LIBRARY_PATH:-}"
      salloc \
        -N "${NNODES}" \
        --ntasks-per-node "${NP}" \
        --exclusive \
        --account="${SLURM_ACCOUNT}" \
        -J "${SLURM_ACCOUNT}-cicd::${GITLAB_USER_LOGIN:-ci}:nccl-m2n-unit-eos::${CI_COMMIT_REF_NAME:-detached}:${CI_COMMIT_SHORT_SHA}" \
        -t "${SLURM_TIME}" \
        bash nccl_m2n/ci/run_nccl_m2n_tests.sh

unit_test_pretyche:
  stage: unit_test
  tags:
    - ptyche
  needs:
    - setup_pretyche
  variables:
    NCCL_HOME: "${PRE_TYCHE_INSTALL_DIR}/build"
    CI_BUILDS_DIR: "${PRE_TYCHE_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NNODES: "1"
    NP: "4"
    NGPUS: "4"
    SLURM_PARTITION: "batch"
    SLURM_ACCOUNT: "coreai_libraries_nccl"
    SLURM_TIME: "30"
  script:
    - |
      set -euxo pipefail
      source "${PRE_TYCHE_INSTALL_DIR}/pre-tyche-config.sh"
      export CUDA_HOME="${PRE_TYCHE_CUDA_HOME}"
      export LD_LIBRARY_PATH="${CUDA_HOME}/lib:${CUDA_HOME}/lib64:${CUDA_HOME}/extras/CUPTI/lib64:${NCCL_HOME}/lib:${LD_LIBRARY_PATH:-}"
      # Ptyche mlx5_0,1,4,5 connect to the compute fabric. mlx5_2,6 connect
      # to the storage fabric and must not be mixed into proxy-GIN rings.
      export NCCL_IB_HCA="mlx5_0,mlx5_1,mlx5_4,mlx5_5"
      salloc \
        -N "${NNODES}" \
        --ntasks-per-node "${NP}" \
        --exclusive \
        -p "${SLURM_PARTITION}" \
        --account="${SLURM_ACCOUNT}" \
        -J "${SLURM_ACCOUNT}-cicd::${GITLAB_USER_LOGIN:-ci}:nccl-m2n-unit-pretyche::${CI_COMMIT_REF_NAME:-detached}:${CI_COMMIT_SHORT_SHA}" \
        -t "${SLURM_TIME}" \
        bash nccl_m2n/ci/run_nccl_m2n_tests.sh

package:python_m2n:
  extends: .ipp6-build
  stage: package
  timeout: 1h
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl
      artifacts: true
    - job: build:nccl_m2n
      artifacts: true
  script:
    - |
      set -euxo pipefail
      current_dir="$(realpath .)"
      srun \
        -p cpuonly \
        -J nccl-extensions:m2n-python \
        -t 01:00:00 \
        -n 1 \
        --exclusive \
        --container-image="${BUILD_CONTAINER_IMAGE}" \
        --container-mounts="${current_dir}:${current_dir}" \
        env \
        CUDA_HOME=/usr/local/cuda \
        NCCL_HOME="${CI_PROJECT_DIR}/.ci/nccl/build" \
        bash "${CI_PROJECT_DIR}/python/ci/verify_m2n_package.sh" \
        "${CI_PROJECT_DIR}/nccl_m2n/build"
  artifacts:
    name: "nccl-extensions-python-${CI_COMMIT_SHORT_SHA}"
    expire_in: 24 hours
    paths:
      - python/dist/

integration_test_eos:
  stage: integration_test
  tags:
    - nccl-eos
  needs:
    - setup_eos
    - unit_test_eos
  variables:
    NCCL_HOME: "${EOS_INSTALL_DIR}/build"
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NCCL_M2N_MPI_TEST_PROFILE: "four_rank"
    NCCL_M2N_MPI_NNODES: "2"
    NCCL_M2N_MPI_NTASKS_PER_NODE: "2"
    SLURM_ACCOUNT: "coreai_libraries_nccl"
    SLURM_TIME: "60"
  script:
    - |
      set -euxo pipefail
      export CUDA_HOME="${EOS_CUDA_HOME}"
      export MPI_HOME="/usr/mpi/gcc/openmpi-4.1.5rc2"
      export PATH="${MPI_HOME}/bin:${PATH}"
      export LD_LIBRARY_PATH="${CUDA_HOME}/lib:${CUDA_HOME}/lib64:${CUDA_HOME}/extras/CUPTI/lib64:${NCCL_HOME}/lib:${MPI_HOME}/lib:${LD_LIBRARY_PATH:-}"
      export OMPI_MCA_btl="tcp,self"
      export OMPI_MCA_btl_tcp_if_include="eth3"
      salloc \
        -N "${NCCL_M2N_MPI_NNODES}" \
        --ntasks-per-node "${NCCL_M2N_MPI_NTASKS_PER_NODE}" \
        --exclusive \
        --account="${SLURM_ACCOUNT}" \
        -J "${SLURM_ACCOUNT}-cicd::${GITLAB_USER_LOGIN:-ci}:nccl-m2n-integration-eos::${CI_COMMIT_REF_NAME:-detached}:${CI_COMMIT_SHORT_SHA}" \
        -t "${SLURM_TIME}" \
        bash nccl_m2n/ci/run_nccl_m2n_mpi_tests.sh

integration_test_pretyche:
  stage: integration_test
  tags:
    - ptyche
  needs:
    - setup_pretyche
    - unit_test_pretyche
  variables:
    NCCL_HOME: "${PRE_TYCHE_INSTALL_DIR}/build"
    CI_BUILDS_DIR: "${PRE_TYCHE_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NCCL_M2N_MPI_TEST_PROFILE: "eight_rank"
    NCCL_M2N_MPI_NNODES: "2"
    NCCL_M2N_MPI_NTASKS_PER_NODE: "4"
    SLURM_PARTITION: "batch"
    SLURM_ACCOUNT: "coreai_libraries_nccl"
    SLURM_TIME: "60"
  script:
    - |
      set -euxo pipefail
      source "${PRE_TYCHE_INSTALL_DIR}/pre-tyche-config.sh"
      configure_test_env
      export CUDA_HOME="${PRE_TYCHE_CUDA_HOME}"
      export MPI_HOME="/lustre/fsw/coreai_libraries_nccl/toolkits/openmpi-5.0.6"
      export PATH="${MPI_HOME}/bin:${PATH}"
      export LD_LIBRARY_PATH="${CUDA_HOME}/lib:${CUDA_HOME}/lib64:${CUDA_HOME}/extras/CUPTI/lib64:${NCCL_HOME}/lib:${MPI_HOME}/lib:${LD_LIBRARY_PATH:-}"
      salloc \
        -N "${NCCL_M2N_MPI_NNODES}" \
        --ntasks-per-node "${NCCL_M2N_MPI_NTASKS_PER_NODE}" \
        --exclusive \
        -p "${SLURM_PARTITION}" \
        --account="${SLURM_ACCOUNT}" \
        -J "${SLURM_ACCOUNT}-cicd::${GITLAB_USER_LOGIN:-ci}:nccl-m2n-integration-pretyche::${CI_COMMIT_REF_NAME:-detached}:${CI_COMMIT_SHORT_SHA}" \
        -t "${SLURM_TIME}" \
        bash nccl_m2n/ci/run_nccl_m2n_mpi_tests.sh
