[project]
name = "nccl-m2n"
version = "0.2.0"
requires-python = ">=3.10"
description = "Standalone NCCL M2N Python bindings layered on nccl4py"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [
    { name = "NVIDIA Corporation" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
]
dependencies = [
    "nccl4py>=0.3.1",
    "numpy",
    "cuda-pathfinder>=1.5.4,<2.0.0",
]

[project.optional-dependencies]
cu12 = [
    "nccl4py[cu12]>=0.3.1",
]
cu13 = [
    "nccl4py[cu13]>=0.3.1",
]
test = [
    "build",
    "pytest",
    "mpi4py",
]

[project.urls]
homepage = "https://developer.nvidia.com/nccl"
documentation = "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/index.html"
repository = "https://github.com/NVIDIA/nccl"

[build-system]
requires = [
    "setuptools>=77.0.3",
    "wheel",
    "Cython>=3.1",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"nccl.m2n.bindings" = ["*.pxd", "*.pyx"]
"nccl.m2n.bindings._internal" = ["*.pxd", "*.pyx"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
