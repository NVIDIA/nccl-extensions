[build-system]
requires = [
    "setuptools>=77.0.3",
    "Cython>=3.1",
    "nccl4py",
]
build-backend = "setuptools.build_meta"

[project]
name = "nccl-extensions"
description = "Python bindings for the nccl-extensions communication libraries (nccl_ep, nccl_m2n)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [
    { name = "NVIDIA Corporation" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "nccl4py",
    "packaging",
    "numpy",
    "cuda-core~=1.0",
    "cuda-pathfinder>=1.5.4,<2.0.0",
    'typing-extensions; python_version < "3.11"',
]

# CUDA-variant extras forward the matching CUDA bindings and CuTeDSL dependencies
# through nccl4py while pinning the NCCL runtime used by nccl-extensions.
[project.optional-dependencies]
# M2N's packaged Python benchmark uses mpi4py for multi-rank coordination.
bench = ["mpi4py"]
cu12 = [
    "nccl4py[cu12]",
    "nvidia-nccl-cu12==2.30.7",
]
cu13 = [
    "nccl4py[cu13]",
    "nvidia-nccl-cu13==2.30.7",
]

[project.urls]
homepage = "https://github.com/NVIDIA/nccl-extensions"
repository = "https://github.com/NVIDIA/nccl-extensions"
issues = "https://github.com/NVIDIA/nccl-extensions/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "nccl._extensions._version.__version__" }

[tool.setuptools.packages.find]
# This distribution owns only nccl/_extensions/, nccl/ep/, and nccl/m2n/ inside the shared
# `nccl` namespace; nccl4py owns nccl/__init__.py, nccl/_version.py, nccl/core/
# and nccl/bindings/. Listing our subpackages explicitly (rather than "nccl*")
# keeps a bare `nccl` package out of the wheel, so we never ship an __init__.py
# that would collide with theirs.
namespaces = true
include = ["nccl._extensions*", "nccl.ep*", "nccl.m2n*"]

[tool.setuptools.package-data]
"nccl._extensions.bindings" = ["cynccl_*.pxd", "nccl_*.pxd"]
"nccl.ep" = [
    "lib/cu12/libnccl_ep.so",
    "lib/cu13/libnccl_ep.so",
    "include/*.h",
    "include/nccl_ep/*.h",
    "include/nccl_ep/*.hpp",
    "include/nccl_ep/device/*.cuh",
    "include/nccl_ep/device/ll/*.cuh",
]
"nccl.m2n" = [
    "lib/cu12/libnccl_m2n.so",
    "lib/cu13/libnccl_m2n.so",
    "include/nccl_m2n.h",
]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*"
skip = "*-musllinux_*"
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["native"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# These libraries are supplied by the matching NCCL/CUDA runtime rather than
# vendored into the nccl-extensions wheel.
repair-wheel-command = "auditwheel repair --exclude libnccl.so.2 --exclude libcuda.so.1 -w {dest_dir} {wheel}"

[tool.uv]
conflicts = [
    [
        { extra = "cu12" },
        { extra = "cu13" },
    ]
]
